# Candidate only. Applying a blueprint does not authorize resuming this job.
services:
  - type: cron
    name: qf-allstate-everflow-sync
    runtime: python
    schedule: "*/15 * * * *"
    autoDeploy: false
    buildCommand: pip install -r requirements.txt
    startCommand: python sync.py preview
    envVars:
      - key: EF_PUBLISH
        value: "0"
      - key: EF_REPORTING_PURPOSE
        value: allocated_click_spend
      - key: EF_OFFER_ID
        value: "4"
      - key: EF_EVENT_ID
        value: "0"
      - key: EF_REPORTING_AFFILIATE_ID
        sync: false
      - key: EF_API_KEY
        sync: false
      - key: MIRROR_DATABASE_URL
        sync: false
      - key: MIRROR_NOT_BEFORE
        sync: false
      - key: REPORTING_ORIGIN
        value: https://lead-sms-api.onrender.com
      - key: REPORTING_USER
        sync: false
      - key: REPORTING_PASSWORD
        sync: false
